name: User interaction tests

on:
  pull_request:
    paths:
      - 'snaploom/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'packaging/requirements-build.txt'
      - '.github/workflows/interactions.yml'
  push:
    branches: [main]
    paths:
      - 'snaploom/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'packaging/requirements-build.txt'
      - '.github/workflows/interactions.yml'

permissions:
  contents: read

jobs:
  interactions:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Test application interactions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Test editor at 150% scaling
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: '1.5'
        run: python -m pytest -q tests/test_editor.py tests/test_editor_controls.py tests/test_annotation_preferences.py
      - name: Verify Windows desktop capture and drag
        env:
          QT_QPA_PLATFORM: windows
          SNAPLOOM_TEST_DESKTOP: '1'
        run: python -m pytest -q tests/test_capture.py tests/test_native_interactions.py tests/test_pin_interactions.py
