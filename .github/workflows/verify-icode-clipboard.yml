name: iCode clipboard compatibility verification
on:
  push:
    branches: [codex/icode-clipboard-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install iCode v0.35.2
        shell: pwsh
        run: |
          python -m pip install iCode-TUI==0.35.2
          "ICODE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Paste Snaploom clipboard images in the iCode chat input
        env:
          QT_QPA_PLATFORM: windows
        run: python -c "import runpy; runpy.run_path('tests/verify_icode_clipboard.py', run_name='__main__')"
