name: iCode clipboard compatibility verification
on:
  push:
    branches: [codex/icode-clipboard-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare the iCode v0.35.2 clipboard reader
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch v0.35.2 https://github.com/openJiuwen-ai/iCode.git "$env:RUNNER_TEMP/icode"
          python -m pip install pillow==13.0.0
          "ICODE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> $env:GITHUB_ENV
          "ICODE_SOURCE=$env:RUNNER_TEMP/icode/src" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Use iCode to read a Snaploom clipboard image
        env:
          QT_QPA_PLATFORM: windows
        run: python tests/verify_icode_clipboard.py
